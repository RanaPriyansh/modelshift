name: Diagnose pnpm lockfile mutation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-lockfile:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out pull-request source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Record dependency identity
        run: |
          node --version
          pnpm --version
          sha256sum package.json pnpm-lock.yaml
          git status --short

      - name: Install exactly from lockfile
        run: pnpm install --frozen-lockfile

      - name: Write mutation report
        if: always()
        run: |
          mkdir -p diagnostic
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "head=$(git rev-parse HEAD)"
            echo "package_sha=$(sha256sum package.json | awk '{print $1}')"
            echo "lockfile_sha=$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          } > diagnostic/identity.txt
          git status --short > diagnostic/status.txt
          git diff --stat > diagnostic/diff-stat.txt
          git diff -- package.json > diagnostic/package.diff
          git diff -- pnpm-lock.yaml > diagnostic/pnpm-lock.diff

      - name: Explain any mutation
        if: always()
        run: |
          cat diagnostic/identity.txt
          echo "--- status ---"
          cat diagnostic/status.txt
          echo "--- diff stat ---"
          cat diagnostic/diff-stat.txt
          echo "--- package diff ---"
          cat diagnostic/package.diff
          echo "--- lockfile diff ---"
          cat diagnostic/pnpm-lock.diff

      - name: Upload lockfile diagnosis
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: forge-pnpm-lockfile-diagnosis-${{ github.run_id }}
          path: diagnostic
          if-no-files-found: error
          retention-days: 2
