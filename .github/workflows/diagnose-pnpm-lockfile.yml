name: Diagnose pnpm lockfile mutation

on:
  push:
    branches:
      - agent/forge-product-reset

permissions:
  contents: read

jobs:
  diagnose-lockfile:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out branch source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Record dependency identity
        run: |
          node --version
          pnpm --version
          sha256sum package.json pnpm-lock.yaml
          git status --short

      - name: Install exactly from lockfile
        run: pnpm install --frozen-lockfile

      - name: Explain any mutation
        if: always()
        run: |
          echo "--- status ---"
          git status --short
          echo "--- diff stat ---"
          git diff --stat
          echo "--- package diff ---"
          git diff -- package.json
          echo "--- lockfile diff ---"
          git diff -- pnpm-lock.yaml
          echo "--- resulting identity ---"
          sha256sum package.json pnpm-lock.yaml
