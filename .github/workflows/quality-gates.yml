name: FORGE quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ""
      FORGE_CLOUD_ACCOUNTS_ENABLED: "false"
      OPENAI_INTERPRETATION_ENABLED: "false"
      OPENAI_FORGE_PLANNER_ENABLED: "false"
      FORGE_BROWSER_ARTIFACT_ID: forge-playwright-failure-${{ github.run_id }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.3"
          package-manager-cache: false
      - name: Capture immutable dependency identity before install
        run: node scripts/operations/immutable-lockfile.mjs capture --source-ref "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - name: Install locked dependencies without dependency scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject high or critical advisories in the locked dependency graph
        run: pnpm audit --audit-level high
      - name: Verify dependency registry signatures
        run: pnpm audit signatures
      - name: Run allowlisted dependency builds
        run: pnpm rebuild esbuild sharp unrs-resolver
      - name: Verify dependency-script source authority
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$GITHUB_SHA" -- scripts/operations/immutable-lockfile.mjs
          git diff --exit-code "$GITHUB_SHA" -- .
          test -z "$(git ls-files --others --exclude-standard)"
          git ls-files --others --ignored --exclude-standard --directory -z | node -e 'const fs = require("node:fs"); const paths = fs.readFileSync(0).toString("utf8").split("\0").filter(Boolean); if (paths.some((path) => path !== "node_modules/" && !path.startsWith("node_modules/"))) process.exit(1)'
          git ls-files -v -z | node -e 'const fs = require("node:fs"); const entries = fs.readFileSync(0).toString("utf8").split("\0").filter(Boolean); if (entries.some((entry) => entry[0] !== "H")) process.exit(1)'
      - name: Verify lockfile and dependency install boundary
        run: node scripts/operations/immutable-lockfile.mjs verify --expected-digest "$FORGE_LOCKFILE_DIGEST"
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Offline evaluation gate
        run: pnpm eval
      - name: Install Chromium test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: University foundation browser acceptance
        id: foundation_browser
        continue-on-error: true
        env:
          FORGE_PLAYWRIGHT_OUTPUT_DIR: test-results/university-foundation
        run: pnpm test:e2e:university-foundation
      - name: Semester Desk active-surface browser acceptance
        id: semester_desk_browser
        continue-on-error: true
        env:
          FORGE_PLAYWRIGHT_OUTPUT_DIR: test-results/university-semester-desk
        run: pnpm test:e2e:university-semester-desk
      - name: Capture immutable build identity
        run: |
          printf 'FORGE_BUILD_TIME=%s\n' "$(date -u -d "$(git show -s --format=%cI "$GITHUB_SHA")" +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          printf 'FORGE_CONTENT_MANIFEST_DIGEST=%s\n' "$(shasum -a 256 scripts/ops/content-package-manifest.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          printf 'FORGE_EVALUATOR_BASELINE_DIGEST=%s\n' "$(shasum -a 256 scripts/ops/evaluation-baseline.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          printf 'FORGE_DATABASE_MIGRATION_IDENTITY=not_configured\n' >> "$GITHUB_ENV"
      - name: Build production artifact
        run: pnpm build
      - name: Browser release contract
        id: browser
        continue-on-error: true
        run: pnpm exec tsx scripts/ops/run-production-browser-verification.ts --expected-sha "$GITHUB_SHA"
      - name: Write sanitized evaluation report
        id: evaluation_report
        if: always()
        continue-on-error: true
        run: pnpm exec tsx scripts/ops/evaluation-report.ts --git-sha "$GITHUB_SHA" --output-dir test-results/release-ops
      - name: Verify local production artifact
        id: local_verify
        if: always()
        continue-on-error: true
        run: pnpm exec tsx scripts/ops/run-local-production-verification.ts --expected-sha "$GITHUB_SHA" --expected-lockfile-digest "$FORGE_LOCKFILE_DIGEST" --output-dir test-results/release-ops
      - name: Write bounded Playwright failure manifest
        id: failure_manifest
        if: always()
        continue-on-error: true
        run: pnpm exec tsx scripts/ops/playwright-artifact-manifest.ts --root test-results --output test-results/release-ops/playwright-artifact-manifest.json --stage-dir test-results/release-ops/playwright-failure-artifacts --tested-sha "$GITHUB_SHA" --artifact-id "$FORGE_BROWSER_ARTIFACT_ID"
      - name: Write development foundation browser receipt
        id: development_foundation_receipt
        if: always()
        continue-on-error: true
        run: |
          pnpm exec tsx scripts/ops/playwright-evidence-receipt.ts \
            --scope development_foundation \
            --tested-sha "$GITHUB_SHA" \
            --status "${{ steps.foundation_browser.outcome == 'success' && 'pass' || 'fail' }}"
      - name: Write development Semester Desk browser receipt
        id: development_semester_desk_receipt
        if: always()
        continue-on-error: true
        run: |
          pnpm exec tsx scripts/ops/playwright-evidence-receipt.ts \
            --scope development_semester_desk \
            --tested-sha "$GITHUB_SHA" \
            --status "${{ steps.semester_desk_browser.outcome == 'success' && 'pass' || 'fail' }}"
      - name: Write exact production artifact browser receipt
        id: production_artifact_receipt
        if: always()
        continue-on-error: true
        run: |
          pnpm exec tsx scripts/ops/playwright-evidence-receipt.ts \
            --scope production_artifact \
            --tested-sha "$GITHUB_SHA" \
            --status "${{ steps.browser.outcome == 'success' && 'pass' || 'fail' }}"
      - name: Upload development foundation browser receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: forge-playwright-evidence-development-foundation-${{ github.run_id }}
          path: test-results/release-ops/forge-browser-evidence-development-foundation.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload development Semester Desk browser receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: forge-playwright-evidence-development-semester-desk-${{ github.run_id }}
          path: test-results/release-ops/forge-browser-evidence-development-semester-desk.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact production artifact browser receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: forge-playwright-evidence-production-artifact-${{ github.run_id }}
          path: test-results/release-ops/forge-browser-evidence-production-artifact.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized operations reports
        if: always() && hashFiles('test-results/release-ops/*') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: forge-release-reports-${{ github.run_id }}
          path: test-results/release-ops/
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded Playwright failure evidence
        if: always() && (steps.foundation_browser.outcome == 'failure' || steps.semester_desk_browser.outcome == 'failure' || steps.browser.outcome == 'failure') && steps.failure_manifest.outcome == 'success' && hashFiles('test-results/release-ops/playwright-artifact-manifest.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: forge-playwright-failure-${{ github.run_id }}
          path: |
            test-results/release-ops/playwright-failure-artifacts/
            test-results/release-ops/playwright-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce release gate outcomes
        if: always()
        env:
          FORGE_FOUNDATION_BROWSER_OUTCOME: ${{ steps.foundation_browser.outcome }}
          FORGE_SEMESTER_DESK_BROWSER_OUTCOME: ${{ steps.semester_desk_browser.outcome }}
          FORGE_PRODUCTION_BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          if test "${{ steps.foundation_browser.outcome }}" = failure || test "${{ steps.semester_desk_browser.outcome }}" = failure || test "${{ steps.browser.outcome }}" = failure; then
            test "${{ steps.failure_manifest.outcome }}" = success
            node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync("test-results/release-ops/playwright-artifact-manifest.json", "utf8")); if (report.schema_version !== "2.0" || !Array.isArray(report.artifacts) || report.artifacts.length === 0) process.exit(1)'
          fi
          test "${{ steps.development_foundation_receipt.outcome }}" = success
          test "${{ steps.development_semester_desk_receipt.outcome }}" = success
          test "${{ steps.production_artifact_receipt.outcome }}" = success
          node <<'NODE'
          const fs = require("node:fs");
          const receipts = [
            ["test-results/release-ops/forge-browser-evidence-development-foundation.json", "development_foundation", process.env.FORGE_FOUNDATION_BROWSER_OUTCOME],
            ["test-results/release-ops/forge-browser-evidence-development-semester-desk.json", "development_semester_desk", process.env.FORGE_SEMESTER_DESK_BROWSER_OUTCOME],
            ["test-results/release-ops/forge-browser-evidence-production-artifact.json", "production_artifact", process.env.FORGE_PRODUCTION_BROWSER_OUTCOME],
          ];
          const same = (left, right) => Array.isArray(left) && Array.isArray(right) && left.length === right.length && left.every((value, index) => value === right[index]);
          for (const [path, scope, outcome] of receipts) {
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const expectedStatus = outcome === "success" ? "pass" : "fail";
            const counts = report.counts;
            if (
              report.schema_version !== "2.0"
              || report.receipt_kind !== "forge_ci_browser_evidence"
              || report.receipt_scope !== scope
              || report.tested_sha !== process.env.GITHUB_SHA.toLowerCase()
              || report.status !== expectedStatus
              || !report.expected
              || !report.observed
              || !Array.isArray(report.expected.specs)
              || !Array.isArray(report.expected.projects)
              || !Array.isArray(report.observed.specs)
              || !Array.isArray(report.observed.projects)
              || !Array.isArray(report.failure_reasons)
              || !Number.isInteger(report.root_errors)
              || counts === null
              || typeof counts !== "object"
            ) process.exit(1);
            if (report.status === "pass") {
              if (
                !same(report.expected.specs, report.observed.specs)
                || !same(report.expected.projects, report.observed.projects)
                || report.expected.specs.length === 0
                || report.expected.projects.length === 0
                || counts.total <= 0
                || counts.passed <= 0
                || counts.failed !== 0
                || counts.flaky !== 0
                || counts.timed_out !== 0
                || report.root_errors !== 0
                || report.failure_reasons.length !== 0
              ) process.exit(1);
            }
          }
          NODE
          test "${{ steps.foundation_browser.outcome }}" = success
          test "${{ steps.semester_desk_browser.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
          test "${{ steps.evaluation_report.outcome }}" = success
          test "${{ steps.local_verify.outcome }}" = success
