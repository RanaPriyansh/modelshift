name: iOS quality

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-quality.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iOS foundation
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Show the Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run iOS verification
        run: ios/Scripts/verify.sh
        env:
          FORGE_REQUIRE_ASSET_BUILD: "1"
